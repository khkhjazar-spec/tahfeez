name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build debug APK
        run: |
          mkdir www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share
          npx cap init "برنامج التحفيظ" com.halaqa.tahfeez --web-dir www
          npx cap add android
          mkdir assets
          cp icon-1024.png assets/icon-only.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#14573c' --iconBackgroundColorDark '#14573c'
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tahfeez-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
